services:
  backend:
    build: ./server
    container_name: wabot-backend
    # Run as non-root for safety. Make sure the mounted ./data and ./server/prisma
    # directories are writable by this UID (e.g. `sudo chown -R 1000:1000 ./data`).
    user: "1000:1000"
    ports:
      - "3003:3002"
    volumes:
      - ./server/prisma:/app/prisma
      - ./data/uploads:/app/uploads
      - ./data/sessions:/app/sessions
      - ./data/logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - PORT=3002
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - shared_apps

  frontend:
    build:
      context: ./client
      args:
        VITE_ADMIN_PHONE: "${VITE_ADMIN_PHONE}"
        VITE_ADMIN_EMAIL: "${VITE_ADMIN_EMAIL}"
        VITE_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
    container_name: wabot-frontend
    ports:
      - "8002:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - shared_apps

networks:
  shared_apps:
    external: true
